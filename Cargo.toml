[package]
name = "kdeocr"
version = "0.1.0"
edition = "2024"
description = "A small screenshot tool for KDE Plasma 6 on Wayland"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tempfile = "3"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
