[package]
name = "kdeocr"
version = "0.1.0"
edition = "2024"
description = "A small screenshot tool for KDE Plasma 6 on Wayland"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
tempfile = "3"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
toml = "1"
ruzstd = "0.9"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
